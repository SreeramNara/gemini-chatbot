steps:
  # build container
  - name: "gcr.io/cloud-builders/docker"
    args:
      ["build", "-t", "gcr.io/$PROJECT_ID/rag-backend", "."]

  # push container
  - name: "gcr.io/cloud-builders/docker"
    args:
      ["push", "gcr.io/$PROJECT_ID/rag-backend"]

  # deploy to Cloud Run (secure version)
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
    [
      "run",
      "deploy",
      "rag-backend",
      "--image",
      "gcr.io/$PROJECT_ID/rag-backend",
      "--region",
      "us-central1",
      "--platform",
      "managed",
      "--allow-unauthenticated",
      "--set-secrets",
      "GEMINI_API_KEY=GEMINI_API_KEY:latest",
      "--memory=1Gi",
      "--cpu=1",
      "--min-instances=1",
      "--max-instances=2"
    ]

images:
  - "gcr.io/$PROJECT_ID/rag-backend"