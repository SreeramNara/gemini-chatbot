steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'build',
        '-t',
        'northamerica-northeast1-docker.pkg.dev/gemini-chatbot-494821/chatbot-repo/chatbot-app:$SHORT_SHA',
        '.'
      ]

  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'push',
        'northamerica-northeast1-docker.pkg.dev/gemini-chatbot-494821/chatbot-repo/chatbot-app:$SHORT_SHA'
      ]

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      [
        'run', 'deploy', 'chatbot-service',
        '--image',
        'northamerica-northeast1-docker.pkg.dev/gemini-chatbot-494821/chatbot-repo/chatbot-app:$SHORT_SHA',
        '--region', 'northamerica-northeast1',
        '--platform', 'managed',
        '--allow-unauthenticated',
        '--port', '8080',
        '--set-secrets', 'GEMINI_API_KEY=gemini-api-key:latest'
      ]

images:
  - 'northamerica-northeast1-docker.pkg.dev/gemini-chatbot-494821/chatbot-repo/chatbot-app:$SHORT_SHA'