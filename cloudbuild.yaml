steps:
  # build container
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "us-central1-docker.pkg.dev/gemini-chatbot-494821/rag-backend/rag-backend"
      - "."

  # push container
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "us-central1-docker.pkg.dev/gemini-chatbot-494821/rag-backend/rag-backend"

  # deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "rag-backend"
      - "--image"
      - "us-central1-docker.pkg.dev/gemini-chatbot-494821/rag-backend/rag-backend"
      - "--region"
      - "us-central1"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--set-secrets"
      - "GEMINI_API_KEY=GEMINI_API_KEY:latest"
      - "--memory=1Gi"
      - "--cpu=1"
      - "--min-instances=1"
      - "--max-instances=2"

images:
  - "us-central1-docker.pkg.dev/gemini-chatbot-494821/rag-backend/rag-backend"

options:
  logging: CLOUD_LOGGING_ONLY